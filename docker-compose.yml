services:
  db:
    image: postgres:14-alpine
    container_name: stonkschool-db
    environment:
      POSTGRES_DB: stonkschool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stonkschool"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: thunderblaze/stonkschool-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stonkschool-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/stonkschool
      PORT: 3000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy_google_client_id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy_google_client_secret}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:3000/api/v1/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET:-dummy_session_secret_key_at_least_64_characters_long_for_security_reasons_12345}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3002}
      MARKET_DATA_MODE: ${MARKET_DATA_MODE:-seed}
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: thunderblaze/stonkschool-frontend:latest
    build:
      context: ./frontend-new
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_WS_URL: ws://localhost:3000
    container_name: stonkschool-frontend
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: